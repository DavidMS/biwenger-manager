server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Resolve the backend through Docker's DNS on each request (cached 10s), so nginx
    # follows the backend if its container is recreated with a new IP.
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Backend REST API and its health check, on the same origin as the UI (no CORS).
    location /api/ {
        proxy_pass $backend;
    }
    location = /actuator/health {
        proxy_pass $backend;
    }

    # Hashed build assets can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/squad, /market, ...) all serve the app shell.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
