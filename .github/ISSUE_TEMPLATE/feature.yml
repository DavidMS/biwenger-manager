name: Feature
description: New functionality or a task from the implementation plan.
title: "[N.N] "
labels: ["type:feature"]
projects: ["DavidMS/8"]
body:
  - type: markdown
    attributes:
      value: |
        One issue = one branch = one PR. Keep it small enough for a PR under ~400 changed lines.
        Add the `phase:N` and `area:*` labels and the phase milestone after creating it.
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why this is needed and where it fits. Link the plan section, related issues and ADRs.
      placeholder: Part of **Phase N**, task N.N in the implementation plan.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkable statements that define done. Claude works until each one is met and reports how.
      value: |
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this issue deliberately doesn't do, so the work doesn't grow.
  - type: textarea
    id: notes
    attributes:
      label: Notes for Claude
      description: Hints, constraints, files to read first, skills or agents to use, decisions already made.
  - type: markdown
    attributes:
      value: |
        **Definition of done:** tests pass and CI is green, docs updated where relevant, journal entry added in `docs/tutorial/journal/`.
