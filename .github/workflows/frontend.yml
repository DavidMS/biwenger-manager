# Lint, format-check, test and build the frontend on every PR (and on main) that touches it.
name: frontend

# Path filters: a PR that doesn't touch this folder gets no check at all. Don't make the
# check "required" in branch protection as is, or those PRs wait for it forever.
on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

# On a PR, a new push cancels the run still going for the previous one. On main a run that has
# started is left to finish, so merged commits get a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      # The same Node as local development: the version comes from frontend/.nvmrc.
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Test
        run: npm test
      # Includes the TypeScript type check (tsc -b).
      - name: Build
        run: npm run build
