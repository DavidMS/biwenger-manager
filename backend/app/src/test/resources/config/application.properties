# Safety net for every app test (golden rule 3: tests never call the real Biwenger API).
# Both Biwenger URLs point at a port where nothing listens, so a test that forgets to point them at
# WireMock fails with "could not reach" instead of calling biwenger.as.com or cf.biwenger.com.
# Tests that use WireMock override these with @DynamicPropertySource. Learned the hard way in #78.
biwenger.base-url=http://127.0.0.1:9
biwenger.cdn-base-url=http://127.0.0.1:9

# Spring caches one context per test configuration (about 13 here), each with its own connection
# pool, all against one PostgreSQL container that accepts 100 connections. Small pools keep the
# total under that limit.
spring.datasource.hikari.maximum-pool-size=3
