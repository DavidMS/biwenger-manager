spring.application.name=biwenger-manager

# Only the health endpoint is exposed over HTTP.
management.endpoints.web.exposure.include=health

# PostgreSQL. Docker Compose sets SPRING_DATASOURCE_* (see .env.example); outside Docker, start the
# database with `docker compose up db` and export SPRING_DATASOURCE_PASSWORD.
spring.datasource.url=jdbc:postgresql://localhost:5432/biwenger
spring.datasource.username=biwenger

# Flyway owns the schema (db/migration); Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
